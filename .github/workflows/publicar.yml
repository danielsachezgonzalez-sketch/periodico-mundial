# Si el editor automático no puede escribir directamente en "main" y sube la
# edición a una rama "claude/...", este flujo valida la edición y la copia a main.
# GitHub Pages publica la rama main automáticamente.
name: Publicar edición

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-edicion
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Traer la edición de la rama del editor
        run: |
          git fetch origin "${GITHUB_REF}"
          git checkout FETCH_HEAD -- edicion.json archivo/
      - name: Validar
        run: node scripts/validar.mjs edicion.json
      - name: Publicar en main
        run: |
          git config user.name "El Centinela (publicador)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edicion.json archivo/
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Edición $(node -p "require('./edicion.json').fecha")"
          git push origin HEAD:main
      - name: Borrar la rama temporal
        if: success()
        run: git push origin --delete "${GITHUB_REF#refs/heads/}" || true
